services:
  cookiegrubber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cookiegrubber
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    environment:
      - CDP_HOST=${CDP_HOST}
      - CDP_PORT=${CDP_PORT}
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:${API_PORT:-8080}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: >
      sh -c '
        if [ -n "${CLI_DOMAINS}" ]; then
          exec cookiegrubber \
            --cdp ${CDP_HOST}:${CDP_PORT} \
            --domains "${CLI_DOMAINS}"
        else
          exec cookiegrubber \
            --api ${API_HOST}:${API_PORT} \
            --cdp ${CDP_HOST}:${CDP_PORT}
        fi
      '
